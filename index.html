<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบขยะแลกรางวัลด้วยบัตรนักเรียน</title>
    <link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="index.js">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <h1>♻️ระบบขยะแลกรางวัล</h1>

        <div id="login-section" class="box">
            <h2>เข้าสู่ระบบด้วยบัตรนักเรียน</h2>
            <p style="font-size: 0.9rem; color: #666;">*(ในระบบจริงสามารถใช้ Email เป็น student_id@school.com ได้)*</p>
            
            <input type="password" id="password" placeholder="รหัสผ่าน">
            <button id="btn-login">เข้าสู่ระบบ</button>
        </div>

        <div id="dashboard-section" class="box hidden">
            <div class="profile-card">
                <h2>สวัสดี, <span id="student-name">กำลังโหลด...</span></h2>
                <p>เลขประจำตัวนักเรียน: <span id="student-card-id">-</span></p>
                <div class="points-display">
                    คะแนนสะสม: <strong id="student-points">0</strong> แต้ม
                </div>
                <button id="btn-logout" class="btn-danger">ออกจากระบบ</button>
            </div>

            <h2 style="margin-top: 30px;">🎁 รายการของรางวัลที่แลกได้</h2>
            <div id="rewards-list" class="rewards-grid">
          </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
